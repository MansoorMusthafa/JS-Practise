<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <button onclick="playerMove('rock')">Rock</button>
    <button onclick="playerMove('scissor')">Scissor</button>
    <button onclick="playerMove('paper')">Paper</button>
    <button
      onclick="
        score.wins = 0;
        score.loses = 0;
        score.ties = 0;
        localStorage.removeItem('score')
      "
    >
      Reset Score
    </button>
    <script>
      let score = JSON.parse(localStorage.getItem("score"));

      if (!score) {
        score = {
          wins: 0,
          loses: 0,
          ties: 0,
        };
      }

      function playerMove(move) {
        const computerMove = pickComputerMove();
        let result = "";

        if (move === "paper") {
          if (computerMove === "rock") {
            result = "You Win";
          } else if (computerMove === "paper") {
            result = "It's a Tie";
          } else if (computerMove === "scissor") {
            result = "You Lose";
          }
        } else if (move === "scissor") {
          if (computerMove === "rock") {
            result = "You Lose";
          } else if (computerMove === "paper") {
            result = "You Win";
          } else if (computerMove === "scissor") {
            result = "It's a Tie";
          }
        } else if (move === "rock") {
          if (computerMove === "rock") {
            result = "It's a Tie";
          } else if (computerMove === "scissor") {
            result = "You Win";
          } else if (computerMove === "paper") {
            result = "You Lose";
          }
        }

        if (result === "You Win") {
          score.wins += 1;
        } else if (result === "You Lose") {
          score.loses += 1;
        } else if (result === "It's a Tie") {
          score.ties += 1;
        }

        localStorage.setItem("score", JSON.stringify(score));

        alert(`You picked ${move}. Computer picked ${computerMove}. ${result}
      Wins: ${score.wins}, Losses: ${score.loses}, Ties: ${score.ties}`);
      }

      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = "";

        if (randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber < 2 / 3) {
          computerMove = "paper";
        } else {
          computerMove = "scissor";
        }

        return computerMove;
      }
    </script>
  </body>
</html>
