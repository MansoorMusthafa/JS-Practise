    <script>
      function playerMove(move) {
        const computerMove = pickComputerMove();
        let result = "";

        if (move === "paper") {
          if (computerMove === "rock") {
            result = "You Win";
          } else if (computerMove === "paper") {
            result = "So Tie";
          } else if (computerMove === "scissor") {
            result = "So Lose";
          }
        } else if (move === "scissor") {
          if (computerMove === "rock") {
            result = "You Lose";
          } else if (computerMove === "paper") {
            result = "You Win";
          } else if (computerMove === "scissor") {
            result = "So Tie";
          }
        } else if (move === "rock") {
          if (computerMove === "rock") {
            result = "So Tie";
          } else if (computerMove === "scissor") {
            result = "You Win";
          } else if (computerMove === "paper") {
            result = "You Lose";
          }
        }

        alert(`You picked ${move}. Computer picked ${computerMove}. ${result}`);
      }

      function pickComputerMove() {
        const randomNumber = Math.random();
        let computerMove = "";

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber > 1 / 2 && randomNumber < 2 / 3) {
          computerMove = "paper";
        } else if (randomNumber >= 2 / 3 && randomNumber <= 1) {
          computerMove = "scissor";
        }
        return computerMove;
        // console.log('Mansoor')------------------------- > This Code will not work becuz the code after return will not work
      }
