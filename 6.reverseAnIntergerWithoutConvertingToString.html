    <script>
      function reversedNum(abc) {
        let rev = 0;
        while (abc > 0) {
          rev = rev * 10 + (abc % 10);
          console.log(rev);
          abc = Math.floor(abc/10);
          console.log(abc);
        }
        return rev;
      }
